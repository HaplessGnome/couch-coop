plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.minecraftforge.gradle' version '[7.0.23,8)' apply false
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
}

subprojects {
    apply plugin: 'java'

    version = mod_version
    group = mod_group
    base.archivesName = "${mod_id}-${project.name}-${minecraft_version}"

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }
}

configure(subprojects.findAll { it.name != 'common' }) {
    // Both loaders compile the shared code in common/ directly. Minecraft 26.x ships
    // unobfuscated, so the same Mojang names (and mixin targets) work on Fabric and Forge.
    sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
    sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

    def expandProps = [
        version          : mod_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_author       : mod_author,
        mod_description  : mod_description,
        minecraft_version: minecraft_version,
        fabric_loader_min: fabric_loader_min,
        forge_major      : forge_version.tokenize('.')[0],
        neoforge_version : neoforge_version,
    ]
    tasks.named('processResources', ProcessResources) {
        inputs.properties(expandProps)
        filesMatching(['fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
            expand(expandProps)
        }
    }
}
